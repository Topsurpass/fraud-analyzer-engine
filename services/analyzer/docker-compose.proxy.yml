# Overlay that puts an authenticating, TLS-terminating Caddy in front of the
# analyzer and stops publishing the analyzer's own port.
#
#   export FAE_BASIC_AUTH_HASH='<output of caddy hash-password>'
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# This is the shape a production deployment needs. The difference in production
# is the database: drop the `postgres` service from the base file and point
# DATABASE_URL at a managed Postgres instead. See DOCKER.md.

services:
  analyzer:
    # Unpublish it. The base file binds 127.0.0.1 on the host; here the
    # analyzer must be reachable only from Caddy, over the compose network, so
    # it gets no host port at all. `!reset` is what removes an inherited list
    # rather than adding to it (Compose 2.24+).
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      - analyzer
    environment:
      FAE_PUBLIC_HOST: ${FAE_PUBLIC_HOST:-localhost}
      FAE_BASIC_AUTH_USER: ${FAE_BASIC_AUTH_USER:-analyst}
      # No default. Caddy refuses to start without it rather than serving with
      # an empty credential.
      FAE_BASIC_AUTH_HASH: ${FAE_BASIC_AUTH_HASH:?run `caddy hash-password` and export the result; see DOCKER.md}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${FAE_HTTPS_PORT:-8443}:443"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
