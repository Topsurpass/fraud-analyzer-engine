[project]
name = "fraud-analyzer-engine"
version = "0.1.0"
description = "Schema-agnostic backend for saved SELECT-only SQL exposed as chart-ready JSON"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "sqlparse>=0.5.2",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: touches a database, an HTTP client, or a migration",
    "live: needs a real PostgreSQL or MySQL server (auto-skips without one)",
    "slow: deliberately burns CPU to assert a performance bound; runs in CI, not on commit",
]
