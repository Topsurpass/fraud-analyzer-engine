# Fly.io deployment for the analyzer service.
#
# Secrets are NOT set here. Set them once with:
#   fly secrets set FAE_DB_BACKEND=neon \
#                   DATABASE_URL='postgresql://...' \
#                   FAE_FERNET_KEY='<32-byte urlsafe base64>'
#
# FAE_FERNET_KEY matters more than it looks. Without it the service generates a
# key onto the container filesystem, which is wiped on every deploy, while the
# encrypted target-database passwords sit in a durable database. A fresh key
# makes every one of them permanently undecryptable.

app = "fraud-analyzer-engine"
primary_region = "iad"

[build]
  dockerfile = "services/analyzer/Dockerfile"

[env]
  FAE_LOG_JSON = "true"
  FAE_LOG_LEVEL = "INFO"
  # A sqlite target's path is resolved against the container filesystem, so it
  # can never point at anything useful here.
  FAE_SQLITE_ALLOWED_DIRS = ""
  # Lock CORS down to the dashboard origin rather than shipping "*".
  # FAE_CORS_ORIGINS = "https://your-dashboard.example.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # Below the anyio threadpool's 40 workers: every endpoint is sync and runs
    # on that pool, so admitting more than it can serve just queues in a place
    # with no visibility.
    soft_limit = 25
    hard_limit = 35

# Liveness. Deliberately checks nothing but the process, so a database outage
# does not turn into a restart loop.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

# Readiness. The long grace period is deliberate: a suspended Neon instance can
# take over ten seconds just to accept a connection, and startup then runs
# Alembic before serving. A short grace here kills the machine mid-migration.
[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
